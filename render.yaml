services:
  - type: web
    name: nova-oficina
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nova-oficina-db
          property: connectionString

databases:
  - name: nova-oficina-db
    databaseName: nova_oficina
    plan: free

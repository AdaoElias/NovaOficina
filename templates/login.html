<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nova Oficina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #1a3c6e; min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .card-body { padding: 2.5rem; }
        .form-control:focus { border-color: #1a3c6e; box-shadow: 0 0 0 .2rem rgba(26,60,110,.15); }
        .btn-primary { background: #1a3c6e; border: none; }
        .btn-primary:hover { background: #2d6bcb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <span class="text-white fs-3 fw-bold"><i class="bi bi-tools"></i> Nova Oficina</span>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title text-center mb-4">Entrar</h5>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <form method="post">
                            <div class="mb-3">
                                <label class="form-label">Usuário</label>
                                <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" name="senha" class="form-control form-control-lg" required>
                            </div>
                            <button class="btn btn-primary w-100 btn-lg mt-2">Entrar</button>
                        </form>
                        <p class="text-center text-muted small mt-3">Sistema de Gestão de Oficina</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
